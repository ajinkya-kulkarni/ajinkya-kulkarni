<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120" role="img" aria-label="GitHub activity statistics">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .border { fill: none; stroke: #d0d7de; }
  .label { fill: #57606a; font-size: 14px; }
  .value { fill: #1f2328; font-size: 30px; font-weight: 600; }
  .divider { stroke: #d8dee4; }
  @media (prefers-color-scheme: dark) {
    .border { stroke: #30363d; }
    .label { fill: #8b949e; }
    .value { fill: #f0f6fc; }
    .divider { stroke: #30363d; }
  }
</style>
<rect x="0.5" y="0.5" width="799" height="119" rx="8" class="border"/>
<line x1="200" y1="25" x2="200" y2="95" class="divider"/>
<line x1="415" y1="25" x2="415" y2="95" class="divider"/>
<line x1="600" y1="25" x2="600" y2="95" class="divider"/>
<text x="40" y="43" class="label">Total stars</text><text x="40" y="82" class="value">74</text><text x="225" y="43" class="label">Commits · 12 months</text><text x="225" y="82" class="value">96</text><text x="440" y="43" class="label">PRs authored</text><text x="440" y="82" class="value">159</text><text x="625" y="43" class="label">Issues opened</text><text x="625" y="82" class="value">100</text>
</svg>
